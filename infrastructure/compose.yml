# 로컬 개발용 최소 구성 (DB). Redis는 4주차에 추가한다.
# 실행: docker compose --env-file infrastructure/.env -f infrastructure/compose.yml up -d
name: securelab

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: securelab
      POSTGRES_USER: securelab
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports:
      # 호스트에 PostgreSQL이 이미 있으면 infrastructure/.env 에 DB_PORT 를 다른 값으로 지정
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securelab -d securelab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
