# 로컬 개발 프로필. `gradlew bootRun`은 기본으로 이 프로필을 쓴다.
# DB 접속 정보는 infrastructure/.env(DB_PASSWORD, DB_PORT)와 루트 .env를 읽는다.
# 같은 이름의 OS 환경 변수가 있으면 그 값이 우선한다.
spring:
  config:
    import:
      # 작업 디렉터리가 backend/ 일 때 (gradlew bootRun)
      - optional:file:../infrastructure/.env[.properties]
      - optional:file:../.env[.properties]
      # 작업 디렉터리가 저장소 루트일 때 (IDE, java -jar)
      - optional:file:./infrastructure/.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:securelab}
    username: ${DB_USERNAME:securelab}
    password: ${DB_PASSWORD}
