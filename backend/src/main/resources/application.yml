spring:
  application:
    name: securelab
  data:
    redis:
      # Redis 장애 시 오래 기다리지 않고 바로 대체 정책으로 넘어가도록 짧게 둔다 (ADR-0004).
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    # 스키마는 Flyway가 관리한다. Hibernate는 엔티티와 스키마가 맞는지 검증만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  error:
    # 에러 응답에 스택 트레이스와 예외 메시지를 넣지 않는다.
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # HTTPS로 배포할 때는 secure: true 로 바꾼다 (로컬은 HTTP).

securelab:
  # SEC-04 API 요청 제한 (고정 윈도우)
  rate-limit:
    authenticated-limit: 120
    anonymous-limit: 60
    window: 60s
  # SEC-03 로그인 보호: (계정+IP) 5회, IP 20회 실패 / 15분 → 남은 시간 동안 차단
  login-protection:
    max-failures-per-account-ip: 5
    max-failures-per-ip: 20
    window: 15m
    digest-secret: ${LOGIN_DIGEST_SECRET:}
  # IP·계정 식별자가 든 기록의 보존 기간. 매일 03:30에 정리한다.
  retention:
    login-attempts: 30d
    security-events: 30d
    cron: "0 30 3 * * *"

springdoc:
  # API 문서는 기본으로 끈다. local 프로필에서만 켠다.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    # 모든 로그 줄에 requestId를 붙인다 (RequestIdFilter가 MDC에 넣음).
    correlation: "[%X{requestId:-}] "

management:
  endpoints:
    web:
      exposure:
        # 웹으로는 health만 노출한다.
        include: health
  endpoint:
    health:
      show-details: never
