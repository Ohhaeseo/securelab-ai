spring:
  application:
    name: securelab
  jpa:
    # 스키마는 Flyway가 관리한다. Hibernate는 엔티티와 스키마가 맞는지 검증만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  error:
    # 에러 응답에 스택 트레이스와 예외 메시지를 넣지 않는다.
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # HTTPS로 배포할 때는 secure: true 로 바꾼다 (로컬은 HTTP).

springdoc:
  # API 문서는 기본으로 끈다. local 프로필에서만 켠다.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    # 모든 로그 줄에 requestId를 붙인다 (RequestIdFilter가 MDC에 넣음).
    correlation: "[%X{requestId:-}] "

management:
  endpoints:
    web:
      exposure:
        # 웹으로는 health만 노출한다.
        include: health
  endpoint:
    health:
      show-details: never
