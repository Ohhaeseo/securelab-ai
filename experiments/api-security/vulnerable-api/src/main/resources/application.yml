# ⚠️ 의도적으로 취약한 실험 대상. 루프백 주소에서만 실행된다 (LoopbackOnlyGuard).
spring:
  application:
    name: vulnerable-api

server:
  address: 127.0.0.1
  port: 18080
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        # 보호 버전(backend)과 같은 호스트에서 쿠키가 섞이지 않도록 이름만 다르게 둔다.
        name: VULNLAB_SESSION
        http-only: true
        same-site: lax
